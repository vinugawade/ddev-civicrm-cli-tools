name: Bug report or support request
description: Report a problem with the DDEV CiviCRM CLI Tools add-on.
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Preliminary checklist
      description: Please complete these checks before submitting an issue.
      options:
        - label: I am using the latest stable version of DDEV
          required: true
        - label: I am using the latest stable version of this add-on
          required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include DDEV, PHP, CMS, CiviCRM, and civicrm/cli-tools versions where applicable.
      placeholder: |
        ddev version
        ddev php --version
        ddev composer show civicrm/cli-tools
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Install the add-on with `ddev add-on get vinugawade/ddev-civicrm-cli-tools`.
        2. Run `...`.
        3. Observe `...`.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add relevant logs, configuration, screenshots, or links.
    validations:
      required: false
